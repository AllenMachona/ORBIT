{% extends "base.html" %}
{% block title %}Sign Up — {{ company_name }}{% endblock %}
{% block content %}

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="bg-white rounded-3 shadow-sm p-4">
                <h4 class="text-center mb-3">Create Your Account</h4>
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" name="first_name" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" name="last_name" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone (for order updates)</label>
                        <input type="text" name="phone" class="form-control" placeholder="e.g. 71234567">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Campus</label>
                        <select name="campus" class="form-select">
                            {% for c in campuses %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" minlength="8" required>
                        <small class="text-muted">At least 8 characters.</small>
                    </div>
                    <button type="submit" class="btn btn-orbit w-100">Create Account</button>
                </form>
                <p class="text-center small text-muted mt-3">
                    Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
